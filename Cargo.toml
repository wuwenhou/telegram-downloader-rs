[workspace]
resolver = "2"
members = [
    "crates/tgdlrs-core",
    "crates/tgdlrs-cli",
    "crates/tgdlrs-worker",
    "crates/tgdlrs-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Telegram Downloader RS contributors"]

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
fs2 = "0.4"
futures-util = "0.3"
grammers-client = "0.12"
grammers-mtsender = "0.12"
grammers-session = { version = "0.12", default-features = false, features = ["serde"] }
grammers-tl-types = "0.12"
hex = "0.4"
libloading = "0.8"
rand = "0.9"
rmcp = { version = "3.10", features = ["transport-io"] }
rpassword = "7"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "io-std",
    "sync",
    "time",
    "net",
    "signal",
    "process",
] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_Registry",
] }

[profile.release]
lto = "thin"
strip = "symbols"
